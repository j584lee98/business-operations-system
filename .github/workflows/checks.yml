name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-whitespace:
    name: Pull request whitespace
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check pull request diff for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git --no-pager diff --check "$BASE_SHA" HEAD

  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        dependencies: [locked, ranges]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked project dependencies
        if: matrix.dependencies == 'locked'
        shell: bash
        run: |
          python -m pip install "uv==0.11.7"
          python -m uv sync --locked --extra dev --python "$(python -c 'import sys; print(sys.executable)')"

      - name: Install dependencies from declared ranges
        if: matrix.dependencies == 'ranges'
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python.exe -m pip install -e ".[dev]"
          else
            .venv/bin/python -m pip install -e ".[dev]"
          fi

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh
